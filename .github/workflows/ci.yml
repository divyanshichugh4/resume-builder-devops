name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Check Application
        run: node --check server.js

  package-and-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Application Package
        run: |
          mkdir -p build
          zip -r build/resume-builder.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "build/*"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-builder-artifact
          path: build/resume-builder.zip
